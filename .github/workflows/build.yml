name: Build Browser (iOS 6, armv7)

on:
  push:
  workflow_dispatch:

env:
  THEOS: /home/runner/theos
  MBEDTLS_VERSION: "3.6.7"
  THEOS_CACHE_KEY: theos-linux-clang11-sdk93-v1

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils python3-pil fonts-dejavu-core libplist-utils libtinfo5 || \
          sudo apt-get install -y --no-install-recommends \
            build-essential fakeroot rsync curl perl zip unzip git libxml2 xz-utils python3-pil fonts-dejavu-core libplist-utils

      - name: Restore Theos cache
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/theos
          key: ${{ env.THEOS_CACHE_KEY }}

      - name: Install Theos, toolchain and iOS 9.3 SDK
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/toolchain" "$THEOS/sdks"

          echo "== toolchain =="
          curl -sSL https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz | tar -xJ -C "$THEOS/toolchain/"
          if [ ! -x "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            CLANG=$(find "$THEOS/toolchain" -type f -name clang -path '*/bin/*' | head -n1)
            echo "clang found at: $CLANG"
            ROOT=$(dirname "$(dirname "$CLANG")")
            mkdir -p "$THEOS/toolchain/linux"
            ln -sfn "$ROOT" "$THEOS/toolchain/linux/iphone"
          fi
          ls -la "$THEOS/toolchain/linux/iphone/bin" | head -n 40

          echo "== SDK =="
          SDK_URL=$(curl -sS https://api.github.com/repos/theos/sdks/releases/latest | grep -o 'https://[^"]*iPhoneOS9\.3\.sdk[^"]*' | head -n1 || true)
          echo "SDK asset: $SDK_URL"
          if [ -n "$SDK_URL" ]; then
            curl -sSL "$SDK_URL" -o /tmp/sdk.archive
            (tar -xJf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || tar -xzf /tmp/sdk.archive -C "$THEOS/sdks/" 2>/dev/null || unzip -q /tmp/sdk.archive -d "$THEOS/sdks/")
          fi
          if [ ! -d "$THEOS/sdks/iPhoneOS9.3.sdk" ]; then
            echo "Falling back to sparse checkout of theos/sdks"
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
            (cd /tmp/sdks && git sparse-checkout set iPhoneOS9.3.sdk)
            mv /tmp/sdks/iPhoneOS9.3.sdk "$THEOS/sdks/"
          fi
          ls "$THEOS/sdks"

      - name: Toolchain diagnostics
        run: |
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          which clang ld64 ldid || true
          clang --version || true
          ldd "$THEOS/toolchain/linux/iphone/bin/clang" | grep -i "not found" || echo "clang: all shared libraries resolved"
          ls "$THEOS/sdks/iPhoneOS9.3.sdk" | head

      - name: Fetch mbedTLS ${{ env.MBEDTLS_VERSION }}
        run: |
          set -e
          curl -sSL "https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-${MBEDTLS_VERSION}/mbedtls-${MBEDTLS_VERSION}.tar.bz2" -o /tmp/mbedtls.tar.bz2
          rm -rf vendor/mbedtls && mkdir -p vendor/mbedtls
          tar -xjf /tmp/mbedtls.tar.bz2 -C vendor/mbedtls --strip-components=1
          mv vendor/mbedtls/include/mbedtls/mbedtls_config.h vendor/mbedtls/include/mbedtls/mbedtls_config_default.h
          cp vendor/mbedtls_config_ios6.h vendor/mbedtls/include/mbedtls/mbedtls_config.h
          echo "mbedTLS sources: $(ls vendor/mbedtls/library/*.c | wc -l)"

      - name: Fetch CA bundle
        run: |
          curl -sSf https://curl.se/ca/cacert.pem -o Resources/cacert.pem
          grep -c "BEGIN CERTIFICATE" Resources/cacert.pem

      - name: Fetch ad block list (Peter Lowe's list, plus the bundled base list)
        run: |
          set -e
          curl -sSfL "https://pgl.yoyo.org/adservers/serverlist.php?hostformat=nohtml&showintro=0&mimetype=plaintext" -o /tmp/adservers.txt || true
          grep -E '^[A-Za-z0-9.-]+\.[A-Za-z]{2,}$' /tmp/adservers.txt > Resources/adblock.txt || true
          echo "ad block domains: $(wc -l < Resources/adblock.txt)"

      - name: Build a trimmed core-js (additive polyfills only, no replacements of native RegExp/String/Array/JSON)
        run: |
          set -e
          mkdir -p Resources/js /tmp/cjs
          cd /tmp/cjs
          npm init -y >/dev/null 2>&1
          npm install core-js-builder@3.41.0 --no-audit --no-fund --silent
          cat > build.js <<'EOF'
          const fs = require('fs');
          const builder = require('core-js-builder');
          builder({
            modules: ['es', 'web.url', 'web.url-search-params', 'web.url.to-json', 'web.dom-collections.for-each', 'web.dom-collections.iterator',
                      'web.structured-clone', 'web.queue-microtask', 'web.dom-exception', 'web.timers', 'web.immediate', 'web.self', 'web.atob', 'web.btoa'],
            exclude: ['es.regexp', 'es.string.replace', 'es.string.split', 'es.string.match', 'es.string.search', 'es.string.match-all',
                      'es.json.stringify', 'es.json.to-string-tag', 'es.array.sort', 'es.array.splice', 'es.array.slice', 'es.array.concat',
                      'es.array.filter', 'es.array.map', 'es.array.reverse', 'es.array.index-of', 'es.array.last-index-of', 'es.array.join',
                      'es.array.for-each', 'es.array.reduce', 'es.array.reduce-right', 'es.array.some', 'es.array.every', 'es.array.push',
                      'es.array.unshift', 'es.parse-int', 'es.parse-float', 'es.number.to-fixed', 'es.number.to-precision', 'es.number.constructor',
                      'es.date', 'es.function', 'es.string.trim', 'es.string.trim-start', 'es.string.trim-end', 'es.object.to-string'],
            summary: { console: { size: true, modules: false } },
            format: 'bundle',
            filename: 'core-js-custom.js'
          }).then(() => { console.log('core-js custom bundle built'); }).catch(e => { console.error(e); process.exit(1); });
          EOF
          node build.js
          npm install terser@5.39.0 --no-audit --no-fund --silent
          npx terser core-js-custom.js --compress --mangle --output "$GITHUB_WORKSPACE/Resources/js/core-js-custom.js"
          cd "$GITHUB_WORKSPACE"
          ls -la Resources/js/core-js-custom.js

      - name: Fetch JavaScript tooling (Babel standalone, polyfills)
        run: |
          set -e
          mkdir -p Resources/js /tmp/babel
          curl -sSfL "https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js" -o /tmp/babel/babel.orig.js
          # Babel standalone itself uses regular expression flags (u, s, y) that the iOS 6 engine rejects:
          # run it through preset-env for IE 11 so that its own literals become ES5 compatible.
          cd /tmp/babel
          npm init -y >/dev/null 2>&1
          npm install @babel/core@7.26.10 @babel/cli@7.26.4 @babel/preset-env@7.26.9 --no-audit --no-fund --silent
          cat > babel.config.json <<'EOF'
          { "presets": [["@babel/preset-env", { "targets": { "ie": "11" }, "modules": false, "exclude": ["transform-typeof-symbol"] }]], "compact": true, "comments": false, "sourceType": "script" }
          EOF
          NODE_OPTIONS=--max-old-space-size=6144 npx babel babel.orig.js --config-file ./babel.config.json --out-file "$GITHUB_WORKSPACE/Resources/js/babel.min.js"
          # TypeScript's transpiler as a candidate (its own code is ES5); minified to keep the bundle small
          curl -sSfL "https://cdn.jsdelivr.net/npm/typescript@4.9.5/lib/typescript.js" -o /tmp/babel/typescript.js
          npm install terser@5.39.0 --no-audit --no-fund --silent
          NODE_OPTIONS=--max-old-space-size=6144 npx terser /tmp/babel/typescript.js --compress --mangle --output "$GITHUB_WORKSPACE/Resources/js/typescript.min.js"
          cd "$GITHUB_WORKSPACE"
          ls -la Resources/js/babel.min.js Resources/js/typescript.min.js
          # regular expression flags that survived (should be none besides g, i, m)
          grep -oE '/[gimsuyd]{1,4}[^a-zA-Z0-9_$]' Resources/js/babel.min.js | grep -E 'u|s|y|d' | sort | uniq -c | sort -rn | head -n 10 || true
          curl -sSfL "https://cdn.jsdelivr.net/npm/regenerator-runtime@0.14.1/runtime.js" -o Resources/js/regenerator-runtime.js
          curl -sSfL "https://cdn.jsdelivr.net/npm/systemjs@6.15.1/dist/s.min.js" -o Resources/js/systemjs.js
          curl -sSfL "https://cdn.jsdelivr.net/npm/systemjs@6.15.1/dist/extras/named-register.min.js" -o Resources/js/systemjs-named-register.js
          curl -sSfL "https://cdn.jsdelivr.net/npm/whatwg-fetch@3.6.20/dist/fetch.umd.js" -o Resources/js/fetch.js
          curl -sSfL "https://cdn.jsdelivr.net/npm/intersection-observer@0.12.2/intersection-observer.js" -o Resources/js/intersection-observer.js
          curl -sSfL "https://cdn.jsdelivr.net/npm/resize-observer-polyfill@1.5.1/dist/ResizeObserver.js" -o Resources/js/resize-observer.js
          ls -la Resources/js

      - name: Generate icons and launch images
        run: python3 tools/gen_assets.py Resources

      - name: Patch SDK (stub re-exported libraries missing from theos/sdks)
        run: |
          set -e
          # The toolchain's plistutil is linked against libplist-2.0.so.4, which Ubuntu 22.04 does not ship.
          # Use the distro binary instead (same CLI).
          TBIN="$THEOS/toolchain/linux/iphone/bin"
          if [ -x /usr/bin/plistutil ]; then
            ln -sf /usr/bin/plistutil "$TBIN/plistutil"
            plistutil --help >/dev/null 2>&1 && echo "plistutil OK" || echo "plistutil still broken"
          fi
          SDK="$THEOS/sdks/iPhoneOS9.3.sdk"
          LIBSYS="$SDK/usr/lib/libSystem.tbd"
          test -f "$LIBSYS"
          # libSystem.tbd re-exports /usr/lib/system/*.dylib; the packaged SDK lacks a few of those stubs
          # (e.g. liblaunch), which makes ld64 fail with "file not found". Create empty TBD stubs.
          for lib in $(grep -o "/usr/lib/system/lib[A-Za-z0-9_]*\.dylib" "$LIBSYS" | sort -u); do
            base="${lib%.dylib}"
            if [ ! -f "$SDK$base.tbd" ] && [ ! -f "$SDK$lib" ]; then
              mkdir -p "$(dirname "$SDK$base.tbd")"
              printf -- '---\narchs:           [ armv7, armv7s, arm64 ]\nplatform:        ios\ninstall-name:    %s\ncurrent-version: 1.0\ncompatibility-version: 1.0\nexports:\n  - archs:           [ armv7, armv7s, arm64 ]\n    symbols:         [ ]\n...\n' "$lib" > "$SDK$base.tbd"
              echo "stubbed $lib"
            fi
          done
          ls "$SDK/usr/lib/system" | head -n 60

          # The packaged libsystem_c.tbd / libsystem_platform.tbd lack the plain libc string/memory
          # symbols (only __platform_* and *_chk variants are listed), so C code fails to link.
          # At runtime libSystem.B.dylib provides them on every iOS version, so add them to the stub.
          LIBC="$SDK/usr/lib/system/libsystem_c.tbd"
          ADD=""
          for sym in _memcpy _memset _memmove _memcmp _memchr _strchr _strcmp _strncmp _strlen _strnlen _bzero \
                     _strcpy _strncpy _strcat _strlcpy _strlcat _strstr _strrchr _strdup _memset_s _memset_pattern4 \
                     _memset_pattern8 _memset_pattern16 _strncasecmp _strcasecmp; do
            if ! grep -Eq "[[ ,]${sym}[], ]" "$LIBC" "$SDK/usr/lib/system/libsystem_platform.tbd"; then
              ADD="${ADD}${sym}, "
            fi
          done
          if [ -n "$ADD" ]; then
            echo "adding to libsystem_c.tbd: $ADD"
            sed -i "0,/symbols:            \[ /s//symbols:            [ ${ADD}/" "$LIBC"
            grep -c "_memcpy" "$LIBC"
          fi

      - name: Build
        run: |
          set -o pipefail
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          make clean || true
          make package FINALPACKAGE=1 -j"$(nproc)" 2>&1 | tee build.log
          echo "== staged app =="
          ls -la .theos/_/Applications/Browser.app

      - name: Make IPAs
        run: |
          set -e
          export PATH="$THEOS/toolchain/linux/iphone/bin:$THEOS/bin:$PATH"
          APP=.theos/_/Applications/Browser.app
          LDID=$(command -v ldid || find "$THEOS" -type f -name ldid | head -n1)
          echo "ldid: $LDID"
          VERSION=$(grep '^Version:' control | cut -d' ' -f2)
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload packages
          cp -a "$APP" /tmp/ipa/Payload/
          # 1) with the JIT entitlement
          "$LDID" -SResources/entitlements.plist /tmp/ipa/Payload/Browser.app/Browser
          "$LDID" -e /tmp/ipa/Payload/Browser.app/Browser | head -n 20 || true
          (cd /tmp/ipa && zip -qr9 "$GITHUB_WORKSPACE/packages/Browser-$VERSION.ipa" Payload)
          # 2) plain signature, for troubleshooting if the entitlement keeps the app from launching
          "$LDID" -S /tmp/ipa/Payload/Browser.app/Browser
          (cd /tmp/ipa && zip -qr9 "$GITHUB_WORKSPACE/packages/Browser-$VERSION-nojit.ipa" Payload)
          ls -la packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: Browser-packages
          path: |
            packages/*.ipa
            packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
