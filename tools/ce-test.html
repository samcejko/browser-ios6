<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>custom elements test</title>
<script>
// the old engine has no customElements: take Chrome's away before the shims run
try { Object.defineProperty(window, 'customElements', { value: undefined, configurable: true, writable: true }); } catch (e) { window.__stripError = String(e); }
</script>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script src="../Resources/jsfix.js"></script>
<script src="../Resources/shims.js"></script>
<script src="../Resources/shims-extra.js"></script>
</head>
<body>
<my-greet name="static"></my-greet>
<lit-like id="litLike"></lit-like>
<div id="host"></div>
<script>
// a custom element written as a class (lowered like the network layer does), used in three ways: parsed markup,
// document.createElement and new
var src = [
  'var log = [];',
  'class MyGreet extends HTMLElement {',
  '  static get observedAttributes() { return ["name"]; }',
  '  count = 0;',
  '  constructor() { super(); this.greeting = "hi"; log.push("ctor"); }',
  '  connectedCallback() { this.count++; this.textContent = this.greeting + " " + (this.getAttribute("name") || "?") + " " + this.count; log.push("connected"); }',
  '  attributeChangedCallback(n, o, v) { log.push("attr:" + n + "=" + v); }',
  '}',
  'customElements.define("my-greet", MyGreet);',
  'window.__ceLog = log; window.MyGreet = MyGreet;',
  // Lit finalizes a class (its elementProperties) in `static get observedAttributes()`, which define reads
  'class LitLike extends HTMLElement {',
  '  static get observedAttributes() { if (!this.hasOwnProperty("elementProperties")) this.elementProperties = new Map([["label", {}]]); return ["label"]; }',
  '  constructor() { super(); var seen = []; this.constructor.elementProperties.forEach(function (v, k) { seen.push(k); }); this.seen = seen.join(","); }',
  '  attributeChangedCallback() {}',
  '}',
  'customElements.define("lit-like", LitLike);'
].join('\n');
var lowered = JSFix.transpile(src, {});
(0, eval)(lowered);
var results = {};
// an ES5 script (Babel output) the engine takes as it is: its this.constructor reads go through __br_ctor (the old
// engine answers an element's interface constructor for el.constructor)
var es5 = 'function Tag() { var s = HTMLElement.call(this) || this; s.seenProps = this.constructor.props; return s; } Tag.props = "p";' +
  'Tag.prototype = Object.create(HTMLElement.prototype, { constructor: { value: Tag, writable: true, configurable: true } }); customElements.define("es5-tag", Tag);';
var es5out = JSFix.run(es5, '{}');
results.es5CtorText = es5out.indexOf('__br_ctor(this)') >= 0 && es5out.indexOf('this.constructor') < 0;
(0, eval)(es5out || es5);
results.es5Ctor = document.createElement('es5-tag').seenProps === 'p';
results.markup = document.querySelector('my-greet').textContent;
results.litLike = document.getElementById('litLike').seen === 'label';
var a = document.createElement('my-greet');
results.createdHasGreeting = a.greeting === 'hi' && a instanceof MyGreet;
a.setAttribute('name', 'created');
document.getElementById('host').appendChild(a);
var b = new MyGreet();
results.newIsElement = b.nodeType === 1 && b.tagName === 'MY-GREET' && b instanceof MyGreet && b.greeting === 'hi';
b.setAttribute('name', 'newed');
document.getElementById('host').appendChild(b);
setTimeout(function () {
  results.createdText = a.textContent;
  results.newText = b.textContent;
  document.getElementById('host').removeChild(a);
  setTimeout(function () {
    document.getElementById('host').appendChild(a);
    setTimeout(function () {
      results.reconnected = a.textContent;
      results.log = window.__ceLog.join(',');
      results.stripError = window.__stripError || null;
      window.__ceResults = results;
      document.title = 'ce done';
    }, 50);
  }, 50);
}, 50);
</script>
</body>
</html>
