<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>jsfix test</title>
<style>
body { font: 13px/1.4 -apple-system, Segoe UI, sans-serif; margin: 16px; }
.pass { color: #080; } .fail { color: #c00; }
pre { background: #f4f4f4; padding: 6px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow: auto; }
</style>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script src="gen-unicode.js"></script>
<script src="../Resources/jsfix.js"></script>
<script src="jsfix-cases.js"></script>
</head>
<body>
<h1>jsfix</h1>
<div id="summary"></div>
<div id="out"></div>
<script>
// Every case is a script body that returns a value: it runs as written (the desktop engine knows the syntax) and as
// lowered by JSFix.transpile; the results must match, and the lowered text must parse as ES5 (acorn ecmaVersion 5,
// plus no function declarations in blocks of strict code, which the old engine rejects).
var CASES = JSFIX_CASES;
// ?early=N: every function of N characters or more is lowered while parsing (the mode of big scripts)
var EARLY = /[?&]early=(\d+)/.test(location.search) ? +RegExp.$1 : null;
// the old engine as jsfix sees it on the iPad: ES5 only, so eval texts get lowered (at transpile time for literals,
// by __br_evalSrc with the page's transpiler for built texts)
Function.__brNative = function (src) { acorn.parse(src, { ecmaVersion: 5, allowReturnOutsideFunction: true }); return function () {}; };
window.__brTranspiler = function () { return true; };
var ES5_PARSE = function (code) {
  var ast = acorn.parse(code, { ecmaVersion: 5, allowReturnOutsideFunction: true });
  // function declarations inside blocks of strict code
  var bad = null;
  var walk = function (n, strict, inBlock) {
    if (!n || typeof n.type !== 'string' || bad) return;
    if (n.type === 'FunctionDeclaration' && inBlock && strict) { bad = 'block function ' + (n.id && n.id.name); return; }
    var fnStrict = strict;
    if ((n.type === 'FunctionDeclaration' || n.type === 'FunctionExpression') && n.body.body.length && n.body.body[0].type === 'ExpressionStatement' && n.body.body[0].expression.value === 'use strict') fnStrict = true;
    for (var k in n) {
      var v = n[k];
      if (!v || typeof v !== 'object') continue;
      var child = function (c) {
        if (!c || typeof c.type !== 'string') return;
        var isFn = n.type === 'FunctionDeclaration' || n.type === 'FunctionExpression';
        walk(c, isFn ? fnStrict : strict, isFn ? false : (n.type === 'BlockStatement' || n.type === 'SwitchCase' ? true : (n.type === 'Program' ? false : inBlock)));
      };
      if (Array.isArray(v)) v.forEach(child); else child(v);
    }
  };
  var progStrict = ast.body.length && ast.body[0].type === 'ExpressionStatement' && ast.body[0].expression.value === 'use strict';
  walk(ast, progStrict, false);
  if (bad) throw new Error(bad);
  return ast;
};
var results = [], pass = 0, total = 0;
var show = function (name, ok, detail, code) {
  total++; if (ok) pass++;
  var div = document.createElement('div');
  div.innerHTML = '<b class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</b> ' + name + (detail ? ' — ' + detail.replace(/</g, '&lt;') : '');
  if (!ok && code) { var pre = document.createElement('pre'); pre.textContent = code; div.appendChild(pre); }
  document.getElementById('out').appendChild(div);
  results.push({ name: name, ok: ok, detail: detail });
};
// results may be promises (async cases): both runs are awaited, a rejection counts as its message
var settle = function (v) {
  if (v && typeof v.then === 'function') return v.then(function (x) { return JSON.stringify(x); }, function (e) { return 'rejected: ' + (e && e.message || e); });
  return Promise.resolve(JSON.stringify(v));
};
var runCase = function (c) {
  var name = c[0], code = c[1], out, expected;
  try { expected = settle(new Function(code)()); } catch (e) { show(name, false, 'original threw: ' + e.message); return Promise.resolve(); }
  try { out = JSFix.transpile(code, EARLY !== null ? { early: EARLY } : {}); } catch (e) { show(name, false, 'transpile threw: ' + (e.message || e.what) + (e.stack ? ' ' + e.stack.split('\n')[1] : '')); return Promise.resolve(); }
  if (out === null) out = code;
  try { ES5_PARSE(out); } catch (e) { show(name, false, 'not ES5: ' + e.message, out); return Promise.resolve(); }
  var actual;
  try { actual = settle(new Function(out)()); } catch (e) { show(name, false, 'lowered threw: ' + e.message, out); return Promise.resolve(); }
  return Promise.all([expected, actual]).then(function (r) { show(name, r[0] === r[1], r[0] === r[1] ? '' : 'expected ' + r[0] + ' got ' + r[1], out); });
};
var chain = Promise.resolve();
CASES.forEach(function (c) { chain = chain.then(function () { return runCase(c); }); });
chain.then(function () {
  document.getElementById('summary').textContent = pass + ' / ' + total;
  document.title = 'jsfix ' + pass + '/' + total + (EARLY !== null ? ' early ' + JSFix.stats.early + ' fallbacks ' + JSFix.stats.fallbacks : '');
  window.__jsfixResults = results;
});
</script>
</body>
</html>
