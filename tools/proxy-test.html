<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>proxy test</title>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script src="../Resources/jsfix.js"></script>
</head>
<body>
<pre id="out">running</pre>
<script>
// The Proxy stand-in the transpiler gives scripts that use Proxy without a fallback (JSFix.transpile with proxy: true;
// on the device the old engine has no Proxy, so it is automatic there).
var CASES = [
  ['get and set traps', 'var log = []; var p = new Proxy({ a: 1 }, { get: function (t, k) { log.push("get " + k); return t[k]; }, set: function (t, k, v) { log.push("set " + k); t[k] = v * 2; return true; } }); p.a; p.a = 5; var last = p.a; return [log, last];', [['get a', 'set a', 'get a'], 10]],
  ['no traps forward', 'var t = { a: 1 }; var p = new Proxy(t, {}); p.a = 2; return [t.a, p.a, Object.keys(p)];', [2, 2, ['a']]],
  ['array push reaches the set trap', 'var t = [1], hits = 0; var p = new Proxy(t, { set: function (t, k, v) { hits++; t[k] = v; return true; } }); p.push(2); return [t.length, t[1], hits > 0, Array.isArray(p), JSON.stringify(p), p.length];', [2, 2, true, true, '[1,2]', 2]],
  ['function apply', 'var f = new Proxy(function (a) { return a + 1; }, { apply: function (t, self, args) { return t(args[0]) * 10; } }); return f(1);', 20],
  ['function construct', 'var C = new Proxy(function (x) { this.x = x; }, { construct: function (t, args) { return { made: args[0] }; } }); var D = new Proxy(function (x) { this.x = x; }, {}); return [new C(3).made, new D(4).x];', [3, 4]],
  ['ownKeys give the scope keys', 'var p = new Proxy({ objects: [{ a: 1 }] }, { ownKeys: function () { return ["a"]; }, get: function (t, k) { return k === "a" ? t.objects[0].a : undefined; } }); var r; with (p) { r = a; } return r;', 1],
  ['methods see the proxy as this', 'var p = new Proxy({ n: 1, inc: function () { this.n++; return this.n; } }, { get: function (t, k) { return t[k]; }, set: function (t, k, v) { t[k] = v + 100; return true; } }); return p.inc();', 102],
  ['needs new', 'try { Proxy({}, {}); return "no"; } catch (e) { return e instanceof TypeError; }', true],
  ['non-object target', 'try { new Proxy(1, {}); return "no"; } catch (e) { return e instanceof TypeError; }', true],
  // framer-motion: motion.div comes from a get trap on a function target
  ['factory proxy answers tag names', 'var cache = {}; var motion = new Proxy(function (c) { return "C:" + c; }, { get: function (t, k) { return k === "create" ? t : (cache[k] || (cache[k] = "C:" + k)); } }); return [motion.div, motion.svg, motion.create("x"), motion("y"), typeof motion];', ['C:div', 'C:svg', 'C:x', 'C:y', 'function']],
  // Vue's reactive Map: only a get trap, which hands out instrumented methods; they must come through it
  ['collection methods through the get trap', 'var raw = new Map([["a", 1]]); var inst = { get: function (k) { return this.__v_raw.get(k) * 10; }, set: function (k, v) { this.__v_raw.set(k, v); return this; }, has: function (k) { return this.__v_raw.has(k); } }; var p = new Proxy(raw, { get: function (t, k) { if (k === "__v_raw") return t; if (Object.prototype.hasOwnProperty.call(inst, k)) return inst[k]; if (k === "size") return t.size; var v = t[k]; return typeof v === "function" ? v.bind(t) : v; } }); p.set("b", 2); var keys = []; p.forEach(function (v, k) { keys.push(k); }); return [p.get("a"), p.get("b"), p.has("b"), p.size, keys.join()];', [10, 20, true, 2, 'a,b']],
  // motion-v (Vue): an object target whose handler only reads; a reactive object (set/has/ownKeys too) gets no names
  ['read-only object proxy answers tag names', 'var m = new Proxy({}, { get: function (t, k) { return k === "create" ? function (c) { return "M:" + c; } : "M:" + k; } }); var r = new Proxy({}, { get: function (t, k) { return t[k]; }, set: function (t, k, v) { t[k] = v; return true; }, has: function (t, k) { return k in t; }, ownKeys: function (t) { return Object.keys(t); } }); return [m.create("div"), m.span, Object.keys(m).length, "div" in r, r.div];', ['M:div', 'M:span', 0, false, undefined]]
];
var pass = 0, lines = [];
CASES.forEach(function (c) {
  var got, err = null;
  try { got = (0, eval)(JSFix.transpile('(function () {' + c[1] + '})();', { proxy: true })); } catch (e) { err = e; }
  var ok = !err && JSON.stringify(got) === JSON.stringify(c[2]);
  if (ok) pass++;
  lines.push((ok ? 'OK   ' : 'FAIL ') + c[0] + (ok ? '' : ': got ' + (err ? 'error ' + err : JSON.stringify(got)) + ', expected ' + JSON.stringify(c[2])));
});
// typeof Proxy keeps the engine's answer (a library with a fallback takes it); the rest gets the stand-in
var text = JSFix.transpile('var t = typeof Proxy; let p = new Proxy({}, {});', { proxy: true });
var textOk = /typeof Proxy/.test(text) && /new __br_Proxy\(/.test(text);
lines.push((textOk ? 'OK   ' : 'FAIL ') + 'typeof Proxy untouched');
if (textOk) pass++;
// a script the engine parses: the text path (as without a native Proxy on the device)
var saved = window.Proxy;
window.Proxy = undefined;
var fast = JSFix.run('"use strict"; var q = new Proxy({ a: 1 }, { get: function (t, k) { return t[k] * 2; } }); window.__fastProxy = q.a;', '{}');
var fastLast = JSFix.last();
window.Proxy = saved;
(0, eval)(fast);
var fastOk = fastLast === 'stand-in' && /^"use strict"/.test(fast) && window.__fastProxy === 2;
lines.push((fastOk ? 'OK   ' : 'FAIL ') + 'text path for parsed scripts' + (fastOk ? '' : ': ' + fastLast + ' ' + window.__fastProxy + ' ' + fast.slice(0, 120)));
if (fastOk) pass++;
// BigInt: an integer Number for scripts that call it without looking first
var bi = (0, eval)(JSFix.transpile('(function () { return [BigInt(10) * 2, 10n + 5n, typeof BigInt, BigInt.asUintN(8, 257), BigInt("-0x10"), 0x1fn]; })();', { bigint: true }));
var biOk = JSON.stringify(bi) === JSON.stringify([20, 15, 'function', 1, -16, 31]);
lines.push((biOk ? 'OK   ' : 'FAIL ') + 'BigInt stand-in' + (biOk ? '' : ': ' + JSON.stringify(bi)));
if (biOk) pass++;
var savedBigInt = window.BigInt;
window.BigInt = undefined;
var fastBi = JSFix.run('window.__fastBigInt = BigInt("0x10") + 1;', '{}');
window.BigInt = savedBigInt;
(0, eval)(fastBi);
var fastBiOk = window.__fastBigInt === 17;
lines.push((fastBiOk ? 'OK   ' : 'FAIL ') + 'BigInt text path' + (fastBiOk ? '' : ': ' + window.__fastBigInt + ' ' + fastBi.slice(0, 120)));
if (fastBiOk) pass++;
// framer-motion's guard `if ("u" < typeof Proxy) return fallback;` right before `new Proxy(...)` asks about the
// stand-in on an engine without Proxy (text path and lowered path)
var FRAMER = 'function B(c) { return "C:" + c; } function mk() { if ("u" < typeof Proxy) return B; var cache = {}; return new Proxy(function (c) { return B(c); }, { get: function (t, k) { return k === "create" ? B : (cache[k] || (cache[k] = B(k))); } }); } var m = mk(); ';
var framerRuns = [['framer guard, text path', FRAMER + 'window.__framer = [m.div, m.create("x"), typeof m.span];'],
                  ['framer guard, lowered path', FRAMER + 'let lw = () => [m.div, m.create("x"), typeof m.span]; window.__framer = lw();']];
framerRuns.forEach(function (fr) {
  var savedProxy = window.Proxy, out = '', ok = false, info = '';
  window.Proxy = undefined;
  // (force: this engine parses `let` and arrows itself, the old one would not)
  try { out = JSFix.run(fr[1], /lowered/.test(fr[0]) ? '{"force":true}' : '{}'); info = JSFix.last(); } catch (e) { info = 'threw ' + e.message; }
  window.Proxy = savedProxy;
  try { window.__framer = null; (0, eval)(out || fr[1]); ok = JSON.stringify(window.__framer) === JSON.stringify(['C:div', 'C:x', 'string']); } catch (e2) { info += ' eval ' + e2.message; }
  lines.push((ok ? 'OK   ' : 'FAIL ') + fr[0] + (ok ? '' : ': ' + info + ' ' + JSON.stringify(window.__framer) + ' ' + out.slice(0, 160)));
  if (ok) pass++;
});
// `sym in obj` with a polyfilled Symbol (core-js on the old engine puts an accessor per symbol on Object.prototype):
// the lowered code asks __br_in, which looks below Object.prototype
(function () {
  var RealSymbol = window.Symbol, ok = false, info = '';
  var FakeSym = function (d) { var s = Object.create(FakeSym.prototype), tag = 'Symbol(' + d + ')_' + Math.random(); s._tag = tag; Object.defineProperty(Object.prototype, tag, { configurable: true, set: function (v) { Object.defineProperty(this, tag, { value: v, configurable: true, writable: true }); } }); return s; };
  FakeSym.prototype.toString = function () { return this._tag; };
  var code = '(function () { var s = Symbol("sb"); var a = {}, b = {}; b[s] = 1; class C {} return [s in a, s in b, "x" in a, s in new C()]; })()';
  try {
    window.Symbol = FakeSym;
    var got = (0, eval)(JSFix.transpile(code, { force: true }));
    ok = JSON.stringify(got) === JSON.stringify([false, true, false, false]);
    info = JSON.stringify(got);
  } catch (e) { info = 'error ' + e.message; }
  window.Symbol = RealSymbol;
  lines.push((ok ? 'OK   ' : 'FAIL ') + 'symbol in with a polyfilled Symbol' + (ok ? '' : ': ' + info));
  if (ok) pass++;
})();
CASES.length += 7;
document.getElementById('out').textContent = lines.join('\n');
document.title = 'proxy ' + pass + '/' + CASES.length;
</script>
</body>
</html>
