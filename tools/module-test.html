<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>module loader test</title>
<script type="importmap">{ "imports": { "utils": "./modtest/utils.js" } }</script>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script src="../Resources/jsfix.js"></script>
<script src="../Resources/cssfix.js"></script>
<script>
// the network layer lowers module files on the device; here the page does it (the loader's test hook)
// ?early=0: every function and class lowered while parsing (the mode of big modules)
var EARLY = /[?&]early=(\d+)/.test(location.search) ? +RegExp.$1 : undefined;
window.__brModuleTransform = function (src, url) { return JSFix.run(src, JSON.stringify({ module: true, url: url, early: EARLY })); };
</script>
<script src="../Resources/shims.js"></script>
<script src="../Resources/shims-extra.js"></script>
</head>
<body>
<pre id="out">running</pre>
<script>
var expected = { count: 2, nsCount: 2, greet: 'hi x', pi: '6.28', star: 's1,s2,star-default,true', renamed: 'helped', cycle: 'abA', map: 'from-map', meta: 'modtest/main.js', lazy: 'lazy', tla: 'waited,late!,3,undefined,undefined', shadow: 'from-map,object,string' };
var fails = [], loads = [];
__brModules['import']('./modtest/main.js', location.href).then(function (ns) {
  var r = ns.results;
  return r.lazy.then(function (lazy) {
    r.lazy = lazy;
    for (var k in expected) if (JSON.stringify(r[k]) !== JSON.stringify(expected[k])) fails.push(k + ': expected ' + JSON.stringify(expected[k]) + ' got ' + JSON.stringify(r[k]));
    // an inline module converted by the HTML rewriter, and an entry of a module file
    var html = '<html><head></head><body><script type="module">import { u } from "./modtest/utils.js"; window.__inlineModule = u + "!";<\/script>' +
               '<script type="module" src="./modtest/star.js"><\/script></body></html>';
    var out = JSON.parse(CSSFix.run('html', html, '{}', JSON.stringify({ transpile: true, polyfillURL: 'https://x.invalid/p.js', pageURL: location.href }))).out;
    var converted = /__brModules\.define\(/.test(out) && /__brModules\.entry\("\.\/modtest\/star\.js"\)/.test(out);
    if (!converted) fails.push('html not converted: ' + out.slice(0, 300));
    var scripts = out.match(/<script>([\s\S]*?)<\/script>/g) || [];
    scripts.forEach(function (s) { (0, eval)(s.replace(/^<script>|<\/script>$/g, '')); });
    return new Promise(function (res) { setTimeout(res, 300); });
  });
}).then(function () {
  if (window.__inlineModule !== 'from-map!') fails.push('inline module: ' + window.__inlineModule);
  // <script type="module"> inserted by a script (html5test's check: a data: URL whose variables stay module-scoped);
  // Chrome runs real module scripts itself, so the shim is told to take another type
  window.__brTestModuleType = 'x-test-module';
  loads = [];
  var add = function (attrs, text) {
    var s = document.createElement('script');
    s.setAttribute('type', 'x-test-module');
    if (attrs.src) s.src = attrs.src;
    if (text) s.text = text;
    s.onload = function () { loads.push(attrs.name); };
    document.body.appendChild(s);
  };
  add({ name: 'data', src: 'data:text/javascript;charset=utf-8,var dynScoped = 1; window.__dyn1 = (typeof window.dynScoped === "undefined") + "," + (this === undefined);' });
  add({ name: 'inline' }, 'import { u } from "./modtest/utils.js"; const v = `${u}?`; window.__dyn2 = v;');
  var frag = document.createDocumentFragment(), s3 = document.createElement('script');
  s3.setAttribute('type', 'x-test-module');
  s3.text = 'window.__dyn3 = (window.__dyn3 || 0) + 1;';
  frag.appendChild(s3);
  document.body.appendChild(frag);
  return new Promise(function (res) { setTimeout(res, 800); });
}).then(function () {
  if (window.__dyn1 !== 'true,true') fails.push('dynamic data: module: ' + window.__dyn1);
  if (window.__dyn2 !== 'from-map?') fails.push('dynamic inline module: ' + window.__dyn2);
  if (window.__dyn3 !== 1) fails.push('module in a fragment ran ' + window.__dyn3 + ' times');
  if (loads.sort().join() !== 'data,inline') fails.push('load events: ' + loads.join());
  document.getElementById('out').textContent = fails.length ? 'FAIL\n' + fails.join('\n') : 'PASS';
  document.title = fails.length ? 'modules FAIL ' + fails.length : 'modules PASS';
}, function (e) {
  document.getElementById('out').textContent = 'ERROR ' + (e && e.stack || e);
  document.title = 'modules ERROR';
});
</script>
</body>
</html>
