<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>lazy test</title>
<script src="https://cdn.jsdelivr.net/npm/acorn@8.14.0/dist/acorn.js"></script>
<script>
// the old engine's parser: ES5 only (engineParses() in jsfix.js asks it)
Function.__brNative = function (src) { acorn.parse(src, { ecmaVersion: 5, allowReturnOutsideFunction: true }); return function () {}; };
</script>
<script src="../Resources/jsfix.js"></script>
</head>
<body>
<pre id="out">running</pre>
<script>
// Lazy factories as the app does them (BRCSSRewriter): JSFix.lazyScan, JSFix.run with {lazy}, the parts JSFix.lazy()
// names cut out of the text the app has, each lowered on its own as "var __br_lazyValue=(<factory>\n);" - every piece
// must parse in the old engine. A Proxy check jsfix rewrites before the big factories (Immer 9, as in imdb.com's _app
// chunk) made the text longer, and the parts cut after it were garbage ("Unexpected token" in the page).
// ?src=babel-test/real/<file>.js runs a real chunk instead of the made-up one.
var es5 = function (code) { try { acorn.parse(code, { ecmaVersion: 5, allowReturnOutsideFunction: true }); return ''; } catch (e) { return e.message; } };
var bigFactory = function (n) {
  var body = ['function(e,t,r){"use strict";'];
  body.push('class Item' + n + ' { constructor(a) { this.a = a; } get twice() { return this.a * 2; } }');
  body.push('const list = [];');
  for (var i = 0; body.join('').length < 60 * 1024; i++) body.push('list.push(new Item' + n + '(' + i + ').twice + `#${' + i + '}`.length);');
  body.push('e.exports = { size: () => list.length, first: list[0] };}');
  return body.join('\n');
};
var madeUp = function () {
  var immer = 'function(e,t,r){"use strict";var hasProxies="undefined"!=typeof Proxy&&void 0!==Proxy.revocable&&"undefined"!=typeof Reflect,' +
    'plugins={};function getPlugin(k){var p=plugins[k];if(!p)throw new Error("[Immer] minified error nr: 18 "+k);return p}' +
    'function draft(b){return hasProxies?Proxy.revocable(b,{get:function(t,k){return t[k]}}).proxy:getPlugin("ES5").make(b)}' +
    'e.exports={hasProxies:hasProxies,draft:draft};}';
  var mods = ['11:' + immer];
  for (var m = 0; m < 5; m++) mods.push((20 + m) + ':' + bigFactory(m));
  return '(self.webpackChunk_N_E=self.webpackChunk_N_E||[]).push([[7],{' + mods.join(',\n') + '}]);';
};
var lines = [], pass = 0, total = 0;
var check = function (name, ok, detail) { total++; if (ok) pass++; lines.push((ok ? 'OK   ' : 'FAIL ') + name + (ok || !detail ? '' : '  ' + detail)); };
var runChunk = function (text, label) {
  var scan = JSFix.lazyScan(text);
  check(label + ': lazyScan finds factories', !!scan, 'none');
  if (!scan) return;
  var out = JSFix.run(text, JSON.stringify({ lazy: 'k' }));
  check(label + ': run keeps factories for later', /^\/\*br-lazy:/.test(out), JSFix.last());
  var skeletonErr = es5(out.replace(/^\/\*br-lazy:[^*]*\*\//, ''));
  check(label + ': the skeleton parses in the old engine', !skeletonErr, skeletonErr);
  var parts = JSON.parse(JSFix.lazy() || '[]');
  check(label + ': JSFix.lazy() names the parts', parts.length > 0, 'none');
  for (var i = 0; i < parts.length; i++) {
    var piece = 'var __br_lazyValue=(' + text.slice(parts[i][0], parts[i][1]) + '\n);';
    var lowered = JSFix.run(piece, '{}'), err = es5(lowered || piece);
    check(label + ': part ' + i + ' (' + Math.round((parts[i][1] - parts[i][0]) / 1024) + ' KB) lowers to ES5', !err, err + ' | ' + JSFix.last() + ' | starts ' + JSON.stringify(text.slice(parts[i][0], parts[i][0] + 40)));
  }
  if (/hasProxies/.test(text)) check(label + ': the Proxy check asks about the stand-in', /typeof __br_Proxy/.test(out), 'not retargeted');
};
var m = /[?&]src=([^&]+)/.exec(location.search);
(m ? fetch(decodeURIComponent(m[1])).then(function (r) { return r.text(); }) : Promise.resolve(madeUp())).then(function (text) {
  // (no Proxy, as on the iPad: jsfix then rewrites the checks)
  var NP = window.Proxy;
  window.Proxy = undefined;
  try { runChunk(text, m ? decodeURIComponent(m[1]) : 'made-up chunk'); } finally { window.Proxy = NP; }
  document.getElementById('out').textContent = pass + '/' + total + ' passed\n' + lines.join('\n');
  document.title = 'lazy ' + pass + '/' + total;
}).catch(function (e) { document.title = 'lazy ERROR ' + e.message; document.getElementById('out').textContent = String(e.stack || e); });
</script>
</body>
</html>
