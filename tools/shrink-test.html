<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shrink test</title>
<style>
body { font: 13px/1.4 -apple-system, Segoe UI, sans-serif; margin: 16px; }
.pass { color: #080; } .fail { color: #c00; }
/* github.com's header: a menu that cannot get narrower and buttons 100% wide beside it */
.bar { width: 700px; display: flex; flex-direction: row; background: #eee; }
.nav ul { display: flex; margin: 0; padding: 0; list-style: none; }
.nav li { white-space: nowrap; padding: 0 10px; }
.cta { margin-left: 16px; width: 100%; display: flex; flex-direction: row; justify-content: flex-end; align-items: center; }
.cta a { white-space: nowrap; padding: 0 6px; background: #ccd; }
/* entries whose link clips its text (apple.com's menu): they cannot get narrower than the text */
.bar3 { width: 200px; display: flex; background: #eee; }
.bar3 a { display: block; overflow: hidden; white-space: nowrap; padding: 0 4px; }
/* two items that can both give up space */
.bar2 { width: 500px; display: flex; background: #eee; }
.half { width: 400px; background: #dde; }
</style>
<script src="../Resources/shims.js"></script>
<script src="../Resources/shims-extra.js"></script>
</head>
<body>
<h1>Rows too wide for their room</h1>
<div id="summary"></div>
<div id="out"></div>
<div class="bar" id="bar"><nav class="nav" id="nav"><ul><li>Platform</li><li>Solutions</li><li>Resources</li><li>Open Source</li><li>Enterprise</li><li>Pricing</li></ul></nav><div class="cta" id="cta"><a>Search</a><a>Sign in</a><a>Sign up</a></div></div>
<div class="bar3" id="bar3"><div><a>Accessories</a></div><div><a>Entertainment</a></div><div><a>Support</a></div></div>
<div class="bar2" id="bar2"><div class="half" id="h1">first half with some words</div><div class="half" id="h2">second half with some words</div></div>
<script>
var results = [], pass = 0, total = 0;
var show = function (name, ok, detail) {
  total++; if (ok) pass++;
  var div = document.createElement('div');
  div.innerHTML = '<b class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</b> ' + name + (detail ? ' - ' + detail : '');
  document.getElementById('out').appendChild(div);
  results.push({ name: name, ok: ok, detail: detail });
};
var box = function (id) { var r = document.getElementById(id).getBoundingClientRect(); return { l: Math.round(r.left), r: Math.round(r.right), w: Math.round(r.width) }; };
window.addEventListener('load', function () {
  setTimeout(function () {
    var bar = box('bar'), nav = box('nav'), cta = box('cta');
    show('the menu keeps its width', nav.w > 300, nav.w + ' px');
    show('the buttons take what is left', cta.r <= bar.r + 1 && Math.abs(cta.l - (nav.r + 16)) <= 2, 'buttons ' + cta.l + '..' + cta.r + ', bar ' + bar.l + '..' + bar.r + ', menu to ' + nav.r);
    var links = document.querySelectorAll('#bar3 a'), clipped = [];
    for (var k = 0; k < links.length; k++) if (links[k].scrollWidth > links[k].clientWidth + 1) clipped.push(links[k].textContent + ' ' + links[k].clientWidth + '/' + links[k].scrollWidth);
    show('entries that clip their text keep its width', !clipped.length, clipped.join(', '));
    var b2 = box('bar2'), a = box('h1'), b = box('h2');
    show('two items share the overflow', b.r <= b2.r + 1 && Math.abs(a.w - b.w) <= 2, a.w + ' + ' + b.w + ' in ' + b2.w);
    document.getElementById('summary').textContent = pass + ' / ' + total;
    document.title = 'shrink ' + pass + '/' + total;
    window.__shrinkResults = results;
  }, 3000);
}, false);
</script>
</body>
</html>
