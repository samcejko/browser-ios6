<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>shims smoke test</title>
<script>
window.__errors = [];
window.onerror = function (msg, src, line, col) { window.__errors.push(msg + ' @' + (src || '').split('/').pop() + ':' + line + ':' + col); };
// ?strip removes the desktop browser's own implementations first, so the shims (Typed OM, CSSOM extras, view
// transitions, worklets) are the ones exercised here
if (/[?&]strip/.test(location.search)) {
    var names = ['CSSStyleValue', 'CSSKeywordValue', 'CSSUnparsedValue', 'CSSVariableReferenceValue', 'CSSNumericValue', 'CSSUnitValue', 'CSSMathValue', 'CSSMathSum', 'CSSMathProduct',
        'CSSMathNegate', 'CSSMathInvert', 'CSSMathMin', 'CSSMathMax', 'CSSMathClamp', 'CSSNumericArray', 'CSSTransformValue', 'CSSTransformComponent', 'CSSTranslate', 'CSSRotate', 'CSSScale',
        'CSSSkew', 'CSSSkewX', 'CSSSkewY', 'CSSPerspective', 'CSSMatrixComponent', 'CSSImageValue', 'CSSColorValue', 'CSSRGB', 'CSSHSL', 'CSSHWB', 'CSSLab', 'CSSLCH', 'CSSOKLab', 'CSSOKLCH',
        'CSSColor', 'StylePropertyMapReadOnly', 'StylePropertyMap', 'Worklet', 'ViewTransition', 'ScrollTimeline', 'ViewTimeline', 'GroupEffect', 'SequenceEffect', 'CSSMarginRule',
        'CSSNamespaceRule', 'CSSStyleProperties', 'CSSPageDescriptors', 'CSSPseudoElement', 'SnapEvent', 'ResizeObserverSize', 'AnimationPlaybackEvent', 'PageRevealEvent'];
    for (var i = 0; i < names.length; i++) try { delete window[names[i]]; } catch (e) {}
    try { delete window.Intl; } catch (e5) {}
    try { delete Element.prototype.computedStyleMap; delete Element.prototype.attributeStyleMap; delete HTMLElement.prototype.attributeStyleMap; delete document.startViewTransition; delete Document.prototype.startViewTransition; } catch (e2) {}
    try { delete HTMLElement.prototype.ontransitionend; delete HTMLElement.prototype.onanimationend; delete HTMLElement.prototype.popover; delete HTMLElement.prototype.showPopover; delete HTMLElement.prototype.hidePopover; delete HTMLElement.prototype.togglePopover; delete HTMLButtonElement.prototype.popoverTargetElement; delete window.ToggleEvent; } catch (e3) {}
    try { for (var k in window.CSS) if (typeof window.CSS[k] === 'function' && k !== 'supports' && k !== 'escape') delete window.CSS[k]; } catch (e4) {}
    // the streams polyfill (the page's own Response stays: the shim wraps it for stream bodies)
    var streams = ['ReadableStream', 'WritableStream', 'TransformStream', 'TextDecoderStream', 'TextEncoderStream', 'ReadableStreamDefaultReader', 'WritableStreamDefaultWriter',
        'ByteLengthQueuingStrategy', 'CountQueuingStrategy'];
    for (var s = 0; s < streams.length; s++) try { delete window[streams[s]]; } catch (e6) {}
}
</script>
<script src="../Resources/shims.js"></script>
<script src="../Resources/shims-extra.js"></script>
</head>
<body>
<h1>shims smoke test</h1>
<pre id="out"></pre>
<a id="blank" href="https://example.com/blank" target="_blank">blank link</a>
<script>
(function () {
    var checks = {
        'errors': window.__errors.length ? window.__errors.join(' | ') : 'none',
        'PointerEvent': typeof window.PointerEvent,
        'customElements.define': typeof window.customElements.define,
        'ReadableStream': typeof window.ReadableStream,
        'crypto.subtle': !!(window.crypto && window.crypto.subtle),
        'RTCPeerConnection': typeof window.RTCPeerConnection,
        'PaymentRequest': typeof window.PaymentRequest,
        'Path2D': typeof window.Path2D,
        'createImageBitmap': typeof window.createImageBitmap,
        'window.open type': typeof window.open,
        'navigator.share': typeof navigator.share,
        'document.fullscreenEnabled': document.fullscreenEnabled,
        'cookieStore': typeof window.cookieStore
    };
    var out = [];
    for (var k in checks) out.push(k + ': ' + checks[k]);
    // stream round trip
    try {
        var rs = new ReadableStream({ start: function (c) { c.enqueue('a'); c.enqueue('b'); c.close(); } });
        var reader = rs.getReader(), got = [];
        (function step() {
            reader.read().then(function (r) {
                if (r.done) { out.push('stream: ' + got.join('')); document.getElementById('out').textContent = out.join('\n'); return; }
                got.push(r.value); step();
            });
        })();
    } catch (e) { out.push('stream error: ' + e.message); }
    var render = function () { document.getElementById('out').textContent = out.join('\n'); };
    // tee(): both branches get every chunk
    try {
        var src = new ReadableStream({ start: function (c) { c.enqueue('x'); c.enqueue('y'); setTimeout(function () { c.enqueue('z'); c.close(); }, 10); } });
        var pair = src.tee(), got1 = [], got2 = [];
        var drain = function (s, into, cb) { var rd = s.getReader(); (function st() { rd.read().then(function (r) { if (r.done) return cb(); into.push(r.value); st(); }); })(); };
        drain(pair[0], got1, function () { drain(pair[1], got2, function () { out.push('tee: ' + got1.join('') + '/' + got2.join('')); render(); }); });
    } catch (e7) { out.push('tee error: ' + e7.message); }
    // new Response(stream)
    try {
        var body = new ReadableStream({ start: function (c) { c.enqueue(new TextEncoder().encode('he')); c.enqueue(new TextEncoder().encode('llo')); c.close(); } });
        new Response(body).text().then(function (t) { out.push('response stream: ' + t); render(); }, function (e) { out.push('response stream error: ' + e.message); render(); });
    } catch (e8) { out.push('response error: ' + e8.message); }
    render();
})();
</script>
</body>
</html>
