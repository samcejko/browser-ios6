<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cssfix test</title>
<script src="../Resources/cssfix.js"></script>
<style>body{font-family:monospace;white-space:pre-wrap;font-size:12px} .fail{color:#b00} .ok{color:#080} h2{font-size:14px}</style>
</head>
<body>
<h2 id="summary">running…</h2>
<div id="out"></div>
<script>
var cases = [
  ['vars root', ':root{--c:#f00;--pad:4px 8px}.a{color:var(--c);padding:var(--pad);margin:var(--nope,2px)}', '.a{color:#f00;padding:4px 8px;margin:2px}'],
  ['vars local', '.b{--x:10px;width:var(--x);height:var(--y)}', '.b{width:10px}'],
  ['vars nested fallback', '.c{color:var(--a,var(--b,blue))}', '.c{color:blue}'],
  ['flex row', '.f{display:flex;justify-content:space-between;align-items:center;flex-direction:row}', '.f{display:-webkit-box;-webkit-box-pack:justify;justify-content:space-between;-webkit-box-align:center;align-items:center;-webkit-box-orient:horizontal;-webkit-box-direction:normal;flex-direction:row}'],
  ['flex wrap', '.g{display:flex;flex-wrap:wrap}', '.g{display:block;-webkit-box-lines:multiple;flex-wrap:wrap}\n.g > *{display:inline-block;vertical-align:top}'],
  ['flex wrap gap justify', '.g{display:flex;flex-wrap:wrap;gap:8px 4px;justify-content:center}', '.g{display:block;-webkit-box-lines:multiple;flex-wrap:wrap;gap:8px 4px;-webkit-box-pack:center;justify-content:center}\n.g > *{display:inline-block;vertical-align:top;margin:4px 2px}\n.g{text-align:center}'],
  ['flex row gap', '.g{display:flex;gap:10px}', '.g{display:-webkit-box;gap:10px}\n.g > * + *{margin-left:10px}'],
  ['flex column gap', '.g{display:flex;flex-direction:column;row-gap:6px}', '.g{display:block;-webkit-box-orient:vertical;-webkit-box-direction:normal;flex-direction:column;row-gap:6px}\n.g > * + *{margin-top:6px}'],
  ['flex child', '.h{flex:1 1 0%;order:2}', '.h{-webkit-box-flex:1;flex:1 1 0%;-webkit-box-ordinal-group:3;order:2}'],
  ['flex basis', '.i{flex:0 0 200px}', '.i{-webkit-box-flex:0;width:200px;flex:0 0 200px}'],
  ['prefix transform', '.j{transform:translateX(10px);transition:transform .3s ease,opacity .2s}', '.j{-webkit-transform:translateX(10px);transform:translateX(10px);-webkit-transition:-webkit-transform .3s ease,opacity .2s;transition:transform .3s ease,opacity .2s}'],
  ['calc', '.k{width:calc(100% - 20px)}', '.k{width:-webkit-calc(100% - 20px)}'],
  ['gradient to right', '.l{background:linear-gradient(to right,#fff,#000)}', '.l{background:-webkit-linear-gradient(left, #fff, #000)}'],
  ['gradient angle', '.m{background:linear-gradient(180deg,red 0%,blue 100%)}', '.m{background:-webkit-linear-gradient(270deg, red 0%, blue 100%)}'],
  ['gradient double stop', '.n{background-image:linear-gradient(red 0% 50%,blue)}', '.n{background-image:-webkit-linear-gradient(red 0%, red 50%, blue)}'],
  ['rgb space', '.o{color:rgb(0 0 0 / 50%);background:rgb(10 20 30)}', '.o{color:rgba(0,0,0,0.5);background:rgb(10,20,30)}'],
  ['hex alpha', '.p{color:#ff000080;border-color:#0f08}', '.p{color:rgba(255,0,0,0.502);border-color:rgba(0,255,0,0.533)}'],
  ['oklch', '.q{color:oklch(62.8% 0.2577 29.23)}', '.q{color:rgb(255,0,0)}'],
  ['clamp min max', '.r{font-size:clamp(1rem,2vw,2rem);width:min(100%,600px);margin:max(1rem,5vw)}', '.r{font-size:16px;width:600px;margin:38.4px}'],
  ['clamp with unknown units', '.r{width:clamp(10%,50%,90%);height:min(10em,50%);top:clamp(10px,5vw,20px)}', '.r{width:50%;height:10em;top:20px}'],
  ['aspect ratio marker', '.r{aspect-ratio:16/9}.s{aspect-ratio:auto 1.5}', '.r{counter-reset:br-aspect 16000 br-aspect-h 9000;aspect-ratio:16/9}\n.s{counter-reset:br-aspect 1500 br-aspect-h 1000;aspect-ratio:auto 1.5}'],
  ['logical', '.s{margin-inline:auto;padding-block:1px 2px;inset:0;inline-size:50%}', '.s{margin-left:auto;margin-right:auto;padding-top:1px;padding-bottom:2px;top:0;right:0;bottom:0;left:0;width:50%}'],
  ['selectors is', ':is(.a,.b) .c{x:1}', ':-webkit-any(.a,.b) .c{x:1}'],
  ['selectors is complex', 'div:is(.a .b,.c){x:1}', '.a div.b,div.c{x:1}'],
  ['selectors not list', '.a:not(.b,.c){x:1}', '.a:not(.b):not(.c){x:1}'],
  ['selectors drop has', '.a:has(.b),.c{x:1}', '.c{x:1}'],
  ['selectors focus-visible placeholder', 'a:focus-visible,input::placeholder{x:1}', 'a:focus,input::-webkit-input-placeholder{x:1}'],
  ['supports grid dropped', '@supports (display:grid){.a{x:1}}.b{y:2}', '.b{y:2}'],
  ['supports not grid unwrapped', '@supports not (display:grid){.a{x:1}}', '.a{x:1}'],
  ['supports flex', '@supports (display:flex) and (--v:1){.a{x:1}}', '.a{x:1}'],
  ['layer unwrap', '@layer base;@layer base{.a{x:1}}', '.a{x:1}'],
  ['container dropped', '@container (min-width:1px){.a{x:1}}', ''],
  ['media range', '@media (width >= 600px) and (hover:hover){.a{x:1}}', '@media (min-width: 600px) and (max-width: 0px){.a{x:1}}'],
  ['media resolution', '@media (min-resolution:2dppx){.a{x:1}}', '@media (-webkit-min-device-pixel-ratio: 2){.a{x:1}}'],
  ['keyframes', '@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}', '@-webkit-keyframes spin{from{-webkit-transform:rotate(0);transform:rotate(0)}\nto{-webkit-transform:rotate(360deg);transform:rotate(360deg)}}'],
  ['nesting skipped', '.a{color:red;.b{color:blue}}', '.a{color:red}'],
  ['comments strings', '.a{content:"/* not a comment */";/* real */color:red}', '.a{content:"/* not a comment */";color:red}'],
  ['env', '.a{padding-top:env(safe-area-inset-top,20px);padding-bottom:env(safe-area-inset-bottom)}', '.a{padding-top:20px;padding-bottom:0px}'],
  ['sizing keywords', '.a{width:fit-content;height:max-content}.b{display:flex;width:min-content}.c{inline-size:min-content}', '.a{display:table;width:auto;width:-webkit-fit-content;height:-webkit-max-content}\n.b{display:-webkit-box;width:-webkit-min-content}\n.c{display:table;width:1px;width:-webkit-min-content}'],
  ['unset', '.a{color:unset;margin:unset}', '.a{color:inherit;margin:initial}'],
  ['individual transforms', '.a{translate:10px 20px;rotate:45deg}', '.a{-webkit-transform:translate(10px, 20px) rotate(45deg);transform:translate(10px, 20px) rotate(45deg)}'],
  ['display grid to block', '.a{display:grid;gap:8px}', '.a{display:block;gap:8px}'],
  ['flex push margin left', '.a{margin-left:auto}', '.a{margin-left:0}'],
  ['flex push margin shorthand', '.a{margin:0 0 0 auto}.b{margin:4px auto 0 0}', '.a{margin:0 0 0 0}\n.b{margin:4px 0 0 0}'],
  ['flex push logical', '.a{margin-inline-start:auto}.b{margin-inline:auto 8px}', '.a{margin-left:0}\n.b{margin-left:0;margin-right:8px}'],
  ['centering margins kept', '.a{margin:0 auto}.b{margin-left:auto;margin-right:auto}.c{margin:auto}', '.a{margin:0 auto}\n.b{margin-left:auto;margin-right:auto}\n.c{margin:auto}'],
  ['color-mix', '.a{color:color-mix(in srgb,red 50%,blue)}', '.a{color:rgb(128,0,128)}'],
  ['important', '.a{color:var(--c,red)!important}', '.a{color:red !important}'],
  ['url untouched', '.a{background:url("data:image/svg+xml,%3Csvg xmlns=(x)%3E") no-repeat}', '.a{background:url("data:image/svg+xml,%3Csvg xmlns=(x)%3E") no-repeat}'],
  ['font-face', '@font-face{font-family:X;src:url(a.woff2) format("woff2") tech(variations),url(a.woff) format("woff")}', '@font-face{font-family:X;src:url(a.woff2) format("truetype"),url(a.woff) format("woff")}'],
  ['import layer', '@import url(a.css) layer(base) supports(display:grid);', '@import url(a.css);'],
  ['html style block', '<html><style>:root{--m:2px}</style><div style="margin:var(--m);display:flex">x</div></html>', '<html><style>.__{}</style><div style="margin:2px;display:-webkit-box">x</div></html>'],
  ['html polyfill injection head', '<!DOCTYPE html><html><head><meta charset="utf-8"><script>var a=1<\/script></head><body></body></html>', '<!DOCTYPE html><html><head><script src="https://x.invalid/p.js"><\/script><meta charset="utf-8"><script>var a=1<\/script></head><body></body></html>'],
  ['html polyfill injection no head', '<html><body><p>x</p></body></html>', '<html><script src="https://x.invalid/p.js"><\/script><body><p>x</p></body></html>'],
  ['html fragment untouched', '<div class="a">fragment</div>', '<div class="a">fragment</div>'],
  ['html json script untouched', '<html><head></head><body><script type="application/ld+json">{"a":1}<\/script><script type="text/template"><b>x</b><\/script></body></html>', '<html><head><script src="https://x.invalid/p.js"><\/script></head><body><script type="application/ld+json">{"a":1}<\/script><script type="text/template"><b>x</b><\/script></body></html>']
];
// pretend transpiler: uppercases scripts that contain "modern"; modules become a System.register stub
window.BRTranspile = {
  run: function (src) { return src.indexOf('modern') >= 0 ? src.toUpperCase() : ''; },
  transpileModule: function (src, id) { return 'System.register("' + id + '",[],function(){return{execute:function(){' + src + '}}});'; }
};
cases.push(['html inline script transpiled', '<html><head></head><body><script>var modern = 1<\/script><script>var old = 1<\/script></body></html>', '<html><head><script src="https://x.invalid/p.js"><\/script></head><body><script>VAR MODERN = 1<\/script><script>var old = 1<\/script></body></html>']);
cases.push(['html modules', '<html><head><script type="importmap">{"imports":{}}<\/script></head><body><script type="module" src="/app.js" crossorigin><\/script><script type="module">import a from "./a.js"<\/script><script nomodule src="/legacy.js"><\/script></body></html>',
  '<html><head><script src="https://x.invalid/p.js"><\/script><script type="systemjs-importmap">{"imports":{}}<\/script></head><body><script>System.import("/app.js").catch(function(e){console.error(e)});<\/script><script>System.register("https://example.com/dir/__inline_module_1.js",[],function(){return{execute:function(){import a from "./a.js"}}});\nSystem.import("https://example.com/dir/__inline_module_1.js").catch(function(e){console.error(e)});<\/script></body></html>']);
var outEl = document.getElementById('out'), pass = 0, fail = 0;
function norm(s){ return s.replace(/\s*\n\s*/g, '\n'); }
for (var i = 0; i < cases.length; i++) {
  var c = cases[i], got, ok;
  try {
    if (c[0] === 'html style block') {
      var r = JSON.parse(CSSFix.run('html', c[1], null)).out;
      got = r.replace(/<style>[^<]*<\/style>/, '<style>.__{}</style>');
    } else if (c[0].indexOf('html ') === 0) {
      got = JSON.parse(CSSFix.run('html', c[1], null, '{"polyfillURL":"https://x.invalid/p.js","transpile":true,"pageURL":"https://example.com/dir/page.html?x=1"}')).out;
    } else {
      got = JSON.parse(CSSFix.run('css', c[1], null)).out;
    }
    ok = norm(got) === norm(c[2]);
  } catch (e) { got = 'EXCEPTION: ' + e.message + '\n' + (e.stack || ''); ok = false; }
  if (ok) pass++; else fail++;
  var d = document.createElement('div');
  d.className = ok ? 'ok' : 'fail';
  d.textContent = (ok ? 'OK   ' : 'FAIL ') + c[0] + (ok ? '' : '\n   in:  ' + c[1] + '\n   got: ' + got + '\n   exp: ' + c[2]);
  outEl.appendChild(d);
}
document.getElementById('summary').textContent = 'cssfix: ' + pass + ' passed, ' + fail + ' failed';
document.title = 'cssfix ' + pass + '/' + (pass + fail);
</script>
</body>
</html>
