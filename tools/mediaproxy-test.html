<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>media proxy test</title>
<style>
body { font: 13px/1.4 -apple-system, Segoe UI, sans-serif; margin: 16px; }
.pass { color: #080; } .fail { color: #c00; }
video { width: 160px; height: 90px; background: #eee; margin-right: 8px; }
</style>
</head>
<body>
<h1>Media the system's player cannot load</h1>
<div id="summary"></div>
<div id="out"></div>
<!-- developer.mozilla.org offers only current TLS ciphers: iOS 6's player gave error 4; the app's proxy loads it -->
<video id="mp4" autoplay muted loop playsinline src="https://developer.mozilla.org/shared-assets/videos/flower.mp4"></video>
<!-- an HLS stream: the playlist and its segments go through the proxy -->
<video id="hls" autoplay muted playsinline src="https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"></video>
<script>
var results = [], pass = 0, total = 0;
var show = function (name, ok, detail) {
  total++; if (ok) pass++;
  var div = document.createElement('div');
  div.innerHTML = '<b class="' + (ok ? 'pass' : 'fail') + '">' + (ok ? 'PASS' : 'FAIL') + '</b> ' + name + (detail ? ' - ' + detail : '');
  document.getElementById('out').appendChild(div);
  results.push({ name: name, ok: ok, detail: detail });
};
var state = function (v) { return 'paused ' + v.paused + ', time ' + v.currentTime.toFixed(2) + ', error ' + (v.error && v.error.code) + ', src ' + String(v.currentSrc || v.src).slice(0, 40); };
window.addEventListener('load', function () {
  setTimeout(function () {
    var a = document.getElementById('mp4'), b = document.getElementById('hls');
    show('an MP4 from a host with current TLS only plays', !a.paused && a.currentTime > 0, state(a));
    show('an HLS stream plays', !b.paused && b.currentTime > 0, state(b));
    document.getElementById('summary').textContent = pass + ' / ' + total;
    document.title = 'mediaproxy ' + pass + '/' + total;
    window.__mediaProxyResults = results;
  }, 15000);
}, false);
</script>
</body>
</html>
