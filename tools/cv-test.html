<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>custom properties test</title>
<script>
window.__errors = [];
window.onerror = function (msg, src, line, col) { window.__errors.push(msg + ' @' + (src || '').split('/').pop() + ':' + line + ':' + col); };
</script>
<script src="../Resources/cssfix.js"></script>
</head>
<body style="margin:0">
<script>
// The page as a site would ship it, through the real rewriter (CSSFix.run('html')). The rewritten stylesheets hold only
// the substituted values, so the desktop browser renders what the old engine would; the style attributes keep their
// custom properties and var() declarations (the shim reads them), which a desktop browser applies by itself as well.
var page = [
  '<style>',
  ':root { --bs-body-bg: #fff; --bs-body-color: #212529; --gap: 5px; }',
  '@media (min-width: 1px) { :root { --gap: 20px; } }',
  '[data-bs-theme=dark] { --bs-body-bg: #212529; --bs-body-color: #dee2e6; }',
  '.card { background-color: var(--bs-body-bg); color: var(--bs-body-color); padding: 4px; }',
  '.btn { --bs-btn-bg: transparent; --bs-btn-color: #212529; --bs-btn-border-color: transparent; display: inline-block; color: var(--bs-btn-color);',
  '  background-color: var(--bs-btn-bg); border: 1px solid var(--bs-btn-border-color); padding: 2px 6px; transition: background-color .3s, color .3s; }',
  '.btn-primary { --bs-btn-bg: #0d6efd; --bs-btn-color: #fff; --bs-btn-border-color: #0d6efd; }',
  '.btn-danger { --bs-btn-bg: #dc3545; --bs-btn-color: #fff; }',
  '.site-override { background-color: rgb(1, 2, 3); }',
  '.ratio { position: relative; width: 160px; --bs-aspect-ratio: 100%; }',
  '.ratio::before { display: block; padding-top: var(--bs-aspect-ratio); content: ""; }',
  '.ratio-16x9 { --bs-aspect-ratio: 56.25%; }',
  '.gapbox { margin-left: var(--gap); height: 5px; }',
  '.usew { width: var(--w, 10px); height: 5px; background: #ccc; }',
  '.outer { --z: 40px; }',
  '.inh { --z: 10px; padding-left: inherit(--z, 3px); }',
  '.spbox { width: var(--sp, 1px); height: 5px; background: #ccc; }',
  '@property --np { syntax: "<length>"; inherits: false; initial-value: 7px; }',
  '.npparent { --np: 50px; }',
  '.npchild { width: var(--np); height: 5px; background: #ccc; }',
  '.hsl { --h: 200; --l: 50%; background-color: hsl(var(--h), 100%, var(--l)); height: 5px; }',
  '.hsl.dark { --l: 20%; }',
  'li:nth-child(odd of .imp) { color: rgb(200, 0, 0); }',
  'td:nth-col(2) { background-color: rgb(0, 0, 200); }',
  'col.sel || td { font-weight: 700; }',
  ':root { --tc: rgb(0, 0, 255); }',
  '.tie-scope { --tc: rgb(255, 0, 0); }',
  '.tie-a { color: var(--tc); }',
  '.tie-b.tie-a { color: rgb(0, 0, 255); }',
  '.fbox { --fc: rgb(0, 128, 0); }',
  '.fck:checked + .fbox { --fc: rgb(128, 0, 0); }',
  '.fbox span { color: var(--fc); }',
  ':root { --fb: rgb(0, 0, 128); }',
  '.fscope { --fb: rgb(0, 128, 128); }',
  '.fck:checked + .fuse { background-color: var(--fb); }',
  '*, ::before, ::after { --tw-rotate: 0; --tw-scale-x: 1; }',
  '.rot { --tw-rotate: 45deg; }',
  '.twbox { transform: rotate(var(--tw-rotate)) scaleX(var(--tw-scale-x)); width: 10px; height: 10px; }',
  '</style>',
  '<ul><li id="l1" class="imp">a</li><li id="l2">b</li><li id="l3" class="imp">c</li><li id="l4" class="imp">d</li></ul>',
  '<table><colgroup><col><col class="sel"></colgroup><tr><td id="c1">1</td><td id="c2">2</td><td id="c3">3</td></tr><tr><td id="c4" colspan="2">4</td><td id="c5">5</td></tr></table>',
  '<div class="card" id="card1">light card</div>',
  '<div data-bs-theme="dark"><div class="card" id="card2">dark card</div></div>',
  '<a class="btn" id="b0">plain</a> <a class="btn btn-primary" id="b1">primary</a> <a class="btn btn-danger" id="b2">danger</a>',
  '<a class="btn btn-primary site-override" id="b3">override</a>',
  '<div class="ratio ratio-16x9" id="r1"></div><div class="ratio" id="r2"></div>',
  '<div class="gapbox" id="g1"></div>',
  '<div style="--w: 123px"><div class="usew" id="w1"></div></div><div class="usew" id="w2"></div>',
  '<div class="outer"><div class="inh" id="i1">inh</div></div>',
  '<div class="spbox" id="sp1"></div>',
  '<div class="npparent"><div class="npchild" id="np1"></div></div>',
  '<div style="--k: 33px"><div id="inl" style="width: var(--k, 5px); height: 5px; background: #ccc"></div></div>',
  '<div class="hsl" id="h1"></div><div class="hsl dark" id="h2"></div>',
  '<div class="tie-scope"><span class="tie-a tie-b" id="t1">tie</span> <span class="tie-a" id="t2">scoped</span></div>',
  '<input type="checkbox" class="fck" id="ck1"><div class="fbox" id="fb1"><span id="fs1">state scope</span></div>',
  '<div class="fscope"><input type="checkbox" class="fck" id="ck2"><span class="fuse" id="fu1">state use</span></div>',
  '<div class="twbox" id="tw1"></div><div class="twbox rot" id="tw2"></div><div class="rot"><div class="twbox" id="tw3"></div></div>'
].join('\n');
var result = JSON.parse(CSSFix.run('html', '<html><head></head><body>' + page + '</body></html>', null, '{"viewportWidth":1024}'));
var html = result.out;
window.__manifest = CSSFix.readManifest(html);
window.__rewritten = html;
window.__brManifestURL = 'data:application/json,' + encodeURIComponent(JSON.stringify(window.__manifest));
document.write(html.replace(/<\/?(html|head|body)>/g, ''));
</script>
<script src="../Resources/shims.js"></script>
<script src="../Resources/shims-extra.js"></script>
<pre id="out" style="font-size: 11px">…</pre>
<script>
var cs = function (id, pseudo) { return getComputedStyle(document.getElementById(id), pseudo || null); };
var run = function () {
  var checks = [];
  var check = function (name, ok, detail) { checks.push((ok ? 'OK   ' : 'FAIL ') + name + (ok ? '' : '  ' + detail)); };
  check('root value', cs('card1').backgroundColor === 'rgb(255, 255, 255)', cs('card1').backgroundColor);
  check('theme attribute scope', cs('card2').backgroundColor === 'rgb(33, 37, 41)' && cs('card2').color === 'rgb(222, 226, 230)', cs('card2').backgroundColor + ' ' + cs('card2').color);
  check('component default', cs('b0').backgroundColor === 'rgba(0, 0, 0, 0)' && cs('b0').color === 'rgb(33, 37, 41)', cs('b0').backgroundColor + ' ' + cs('b0').color);
  check('variant class', cs('b1').backgroundColor === 'rgb(13, 110, 253)' && cs('b1').color === 'rgb(255, 255, 255)' && cs('b1').borderTopColor === 'rgb(13, 110, 253)', cs('b1').backgroundColor + ' ' + cs('b1').color + ' ' + cs('b1').borderTopColor);
  check('second variant', cs('b2').backgroundColor === 'rgb(220, 53, 69)', cs('b2').backgroundColor);
  check('equal static value: the more specific site rule wins', cs('t1').color === 'rgb(0, 0, 255)' && cs('t2').color === 'rgb(255, 0, 0)', cs('t1').color + ' ' + cs('t2').color);
  check('site rule wins over the var() rule', cs('b3').backgroundColor === 'rgb(1, 2, 3)' && cs('b3').color === 'rgb(255, 255, 255)', cs('b3').backgroundColor + ' ' + cs('b3').color);
  check('::before through a generated rule', document.getElementById('r1').offsetHeight === 90 && document.getElementById('r2').offsetHeight === 160, document.getElementById('r1').offsetHeight + ' ' + document.getElementById('r2').offsetHeight);
  check('definition inside @media', cs('g1').marginLeft === '20px', cs('g1').marginLeft);
  check('style attribute definition, fallback outside', document.getElementById('w1').offsetWidth === 123 && document.getElementById('w2').offsetWidth === 10, document.getElementById('w1').offsetWidth + ' ' + document.getElementById('w2').offsetWidth);
  check('inherit()', cs('i1').paddingLeft === '40px', cs('i1').paddingLeft);
  check('@property inherits: false', document.getElementById('np1').offsetWidth === 7, document.getElementById('np1').offsetWidth);
  var inl = document.getElementById('inl');
  check('var() in a style attribute', inl.offsetWidth === 33 && !!(inl.__brCVSet && inl.__brCVSet.width), inl.offsetWidth + ' ' + JSON.stringify(inl.__brCVSet));
  check('hsl() from two properties', cs('h1').backgroundColor === 'rgb(0, 170, 255)' && cs('h2').backgroundColor === 'rgb(0, 68, 102)', cs('h1').backgroundColor + ' ' + cs('h2').backgroundColor);
  check('getComputedStyle().getPropertyValue(--w)', cs('w1').getPropertyValue('--w') === '123px', JSON.stringify(cs('w1').getPropertyValue('--w')));
  var red = function (id) { return cs(id).color === 'rgb(200, 0, 0)'; };
  check(':nth-child(odd of .imp)', red('l1') && !red('l2') && !red('l3') && red('l4'), [red('l1'), red('l2'), red('l3'), red('l4')].join());
  var blue = function (id) { return cs(id).backgroundColor === 'rgb(0, 0, 200)'; }, bold = function (id) { return cs(id).fontWeight === '700'; };
  check(':nth-col(2) with colspan', !blue('c1') && blue('c2') && !blue('c3') && blue('c4') && !blue('c5'), ['c1', 'c2', 'c3', 'c4', 'c5'].map(blue).join());
  check('column combinator col.sel || td', !bold('c1') && bold('c2') && !bold('c3') && bold('c4') && !bold('c5'), ['c1', 'c2', 'c3', 'c4', 'c5'].map(bold).join());
  // `*` definitions hold on every element: a child of .rot gets the `*` value again, it does not inherit 45deg
  var tf = function (id) { return cs(id).transform || cs(id).webkitTransform; };
  check('universal definitions (Tailwind *, ::before, ::after)', /^matrix\(1, 0, 0, 1/.test(tf('tw1')) && /^matrix\(0\.7071/.test(tf('tw2')) && /^matrix\(1, 0, 0, 1/.test(tf('tw3')), tf('tw1') + ' | ' + tf('tw2') + ' | ' + tf('tw3'));
  // dynamic: a class and a script-set custom property
  document.getElementById('b0').className += ' btn-danger';
  document.getElementById('sp1').style.setProperty('--sp', '77px');
  // styles scripts insert: CSSOM rules (CSS-in-JS) and <style> text (style-loader)
  var rtSheet = document.createElement('style');
  document.head.appendChild(rtSheet);
  var inserted = rtSheet.sheet.insertRule('.rt1{display:flex;gap:10px;color:rgb(0 0 255 / 50%)}', 0);
  var rtText = document.createElement('style');
  rtText.textContent = '.rt2{display:flex;inset:0}';
  document.head.appendChild(rtText);
  var rtVars = document.createElement('style');
  rtVars.appendChild(document.createTextNode('.rt3{--rq:3px}.rt3.big{--rq:9px}.rt3 i{display:block;height:2px;background:#999;width:var(--rq)}'));
  document.head.appendChild(rtVars);
  var rtBox = document.createElement('div');
  rtBox.className = 'rt3 big';
  rtBox.innerHTML = '<i id="rq"></i>';
  document.body.appendChild(rtBox);
  setTimeout(function () {
    check('class added later', cs('b0').backgroundColor === 'rgb(220, 53, 69)', cs('b0').backgroundColor);
    check('style.setProperty(--sp)', document.getElementById('sp1').offsetWidth === 77, document.getElementById('sp1').offsetWidth);
    var r0 = rtSheet.sheet.cssRules;
    check('insertRule rewritten, still one rule', inserted === 0 && r0.length === 1 && /-webkit-box/.test(r0[0].cssText) && /rgba\(0, 0, 255, 0\.5\)/.test(r0[0].cssText), r0.length + ' ' + (r0[0] && r0[0].cssText));
    check('<style> text rewritten', /-webkit-box/.test(rtText.textContent) && /top:\s*0/.test(rtText.textContent), rtText.textContent);
    check('runtime style with scoped custom properties', document.getElementById('rq').offsetWidth === 9, document.getElementById('rq').offsetWidth + ' ' + rtVars.textContent.slice(0, 200));
    // state pseudo-classes (hover, focus, checked...): an event redoes only what those rules match (with the subtree
    // where they define custom properties), not the whole page. (:checked here: the test page has no focus)
    var tick = function (id, on) {
      var box = document.getElementById(id);
      box.checked = on;
      box.dispatchEvent(new Event('change', { bubbles: true }));
    };
    var st0 = window.__brVars.state().passes;
    tick('ck1', true);
    setTimeout(function () {
      var st1 = window.__brVars.state();
      check('state rule defines a custom property (subtree)', cs('fs1').color === 'rgb(128, 0, 0)', cs('fs1').color);
      check('a state pass is partial', st1.passes > st0 && /changed, change/.test(st1.dirty || ''), JSON.stringify(st1));
      tick('ck1', false);
      tick('ck2', true);
      setTimeout(function () {
        check('state rule uses a scoped custom property', cs('fu1').backgroundColor === 'rgb(0, 128, 128)' && cs('fs1').color === 'rgb(0, 128, 0)', cs('fu1').backgroundColor + ' ' + cs('fs1').color);
        tick('ck2', false);
        setTimeout(function () {
          check('the state ends: value taken back', cs('fu1').backgroundColor === 'rgba(0, 0, 0, 0)', cs('fu1').backgroundColor);
          finish();
        }, 1500);
      }, 1500);
    }, 1500);
  }, 1500);
  var finish = function () {
    checks.push('errors: ' + (window.__errors.join(' | ') || 'none'));
    checks.push('state ' + JSON.stringify(window.__brVars && window.__brVars.state()) + ' cv=' + (window.__manifest && window.__manifest.cv ? window.__manifest.cv.length : 0));
    document.getElementById('out').textContent = checks.join('\n');
    var fails = checks.filter(function (c) { return c.indexOf('FAIL') === 0; }).length;
    document.title = 'cv ' + (checks.length - 2 - fails) + '/' + (checks.length - 2);
  };
};
// hidden tabs run timers at most once a second: wait for the shim's first pass
var waitStart = Date.now();
var waitForShim = function () {
  var st = window.__brVars && window.__brVars.state();
  if ((st && st.passes > 0) || Date.now() - waitStart > 8000) setTimeout(run, 300); else setTimeout(waitForShim, 200);
};
setTimeout(waitForShim, 200);
</script>
</body>
</html>
