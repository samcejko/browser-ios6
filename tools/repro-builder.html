<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>repro builder</title>
<script src="../Resources/cssfix.js"></script>
</head>
<body>
<pre id="out">working</pre>
<script>
// Rewrites a saved page like the app does (the document, then its stylesheets in order with the page's custom
// properties so far) and saves, through the dev server's POST /save/, what a device test needs to reproduce a
// rendering problem offline: <name>-body.html (the rewritten body, scripts removed) and <name>-rules.json (the
// top-level rules of the rewritten stylesheets, for bisecting).
// ?dir=samples/astro&html=index.html&css=style1.css,style2.css&name=astro&vw=768
var q = {};
location.search.slice(1).split('&').forEach(function (p) { var kv = p.split('='); q[kv[0]] = decodeURIComponent(kv[1] || ''); });
var get = function (u) { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(null); return x.responseText; };
var save = function (name, text) { var x = new XMLHttpRequest(); x.open('POST', '/save/' + name, false); x.send(text); return x.status; };
var base = '/' + q.dir + '/', vars = {}, opts = JSON.stringify({ viewportWidth: +(q.vw || 768), devicePixelRatio: 1, pageURL: 'https://' + (q.host || 'example.com') + '/' });
var run = function (kind, text) {
  var r = JSON.parse(CSSFix.run(kind, text, vars, opts));
  for (var k in r.vars) vars[k] = r.vars[k];
  if (r.scoped && r.scoped.length) vars[' scoped'] = ((vars[' scoped'] || '') + ' ' + r.scoped.join(' ')).trim();
  return r.out.replace(/\n?\/\*br-manifest:[\s\S]*$/, '').replace(/\n?<!--br-manifest:[\s\S]*-->\s*$/, '');
};
var html = run('html', get(base + q.html));
var css = (q.css || '').split(',').filter(Boolean).map(function (f) { return run('css', get(base + f)); }).join('\n');
// top-level rules (a rule is a prelude plus its balanced { } block; @import/@charset statements end at ;)
var rules = [], depth = 0, start = 0, i, c, inStr = null;
for (i = 0; i < css.length; i++) {
  c = css.charAt(i);
  if (inStr) { if (c === '\\') { i++; continue; } if (c === inStr) inStr = null; continue; }
  if (c === '"' || c === "'") { inStr = c; continue; }
  if (c === '/' && css.charAt(i + 1) === '*') { var e = css.indexOf('*/', i + 2); i = e < 0 ? css.length : e + 1; continue; }
  if (c === '{') depth++;
  else if (c === '}') { depth--; if (depth === 0) { rules.push(css.slice(start, i + 1).trim()); start = i + 1; } }
  else if (c === ';' && depth === 0) { rules.push(css.slice(start, i + 1).trim()); start = i + 1; }
}
var body = html.replace(/<script\b[\s\S]*?<\/script\s*>/gi, '').replace(/<link[^>]*rel="?stylesheet"?[^>]*>/gi, '');
var s1 = save(q.name + '-body.html', body), s2 = save(q.name + '-rules.json', JSON.stringify(rules));
document.getElementById('out').textContent = 'body ' + body.length + ' (' + s1 + '), rules ' + rules.length + ' (' + s2 + ')';
document.title = 'repro saved';
</script>
</body>
</html>
