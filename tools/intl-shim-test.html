<!DOCTYPE html>

<script>window.NativeIntl = window.Intl; delete window.Intl;</script>

<body>
<pre id="out">running</pre>
<script>

    } catch (e) { return true; }

  DurationFormat: function () { return !('DurationFormat' in I); }

  ['unit long 1', function (X) { return new X.NumberFormat('en', { style: 'unit', unit: 'kilometer', unitDisplay: 'long' }).format(1); }],

  ['unit long 1.5', function (X) { return new X.NumberFormat('en', { style: 'unit', unit: 'hour', unitDisplay: 'long' }).format(1.5); }],

  ['plural categories cs', function (X) { return new X.PluralRules('cs').resolvedOptions().pluralCategories.join(); }],
  ['dateStyle with hour throws', function (X) { try { new X.DateTimeFormat('en', { dateStyle: 'short', hour: 'numeric' }); return 'no'; } catch (e) { return e.name; } }],
  ['h11 midnight', function (X) { return new X.DateTimeFormat('en', { hourCycle: 'h11', hour: 'numeric', timeZone: 'UTC' }).format(new Date(Date.UTC(2026, 0, 1, 0, 30))); }],
  ['h11 parts', function (X) { return new X.DateTimeFormat('en', { hourCycle: 'h11', hour: 'numeric', timeZone: 'UTC' }).formatToParts(0).map(function (p) { return p.type; }).join(); }],
  ['locale variants', function (X) { var l = new X.Locale('de-DE-1996'); return [l.language, l.region, l.variants, l.baseName].join('|'); }],
  ['locale script', function (X) { var l = new X.Locale('zh-hant-tw'); return [l.language, l.script, l.region, l.baseName, l.toString()].join('|'); }],
  ['locale keywords', function (X) { var l = new X.Locale('de-u-ca-gregory-hc-h23'); return [l.calendar, l.hourCycle, l.baseName, l.toString()].join('|'); }],
  ['locale options', function (X) { var l = new X.Locale('en', { region: 'GB', hourCycle: 'h12' }); return [l.region, l.hourCycle, l.toString()].join('|'); }],
  ['locale private use', function (X) { return new X.Locale('und-x-private').toString(); }],
  ['locale maximize', function (X) { return new X.Locale('en').maximize().toString(); }],
  ['locale maximize cs', function (X) { return new X.Locale('cs').maximize().toString(); }],
  ['locale minimize', function (X) { return new X.Locale('en-Latn-US').minimize().toString(); }],
  ['locale week cs', function (X) { return JSON.stringify(new X.Locale('cs-CZ').getWeekInfo()); }],
  ['locale week us', function (X) { return JSON.stringify(new X.Locale('en-US').getWeekInfo()); }],
  ['locale week gb', function (X) { return JSON.stringify(new X.Locale('en-GB').getWeekInfo()); }],
  ['locale hour cycles', function (X) { return [new X.Locale('en-US').getHourCycles(), new X.Locale('cs-CZ').getHourCycles(), new X.Locale('en-GB').getHourCycles()].join('|'); }],
  ['locale text info', function (X) { return [new X.Locale('ar').getTextInfo().direction, new X.Locale('cs').getTextInfo().direction].join(); }],
  ['locale time zones', function (X) { return [new X.Locale('cs-CZ').getTimeZones(), String(new X.Locale('cs').getTimeZones())].join('|'); }],
  ['locale calendars', function (X) { return [new X.Locale('cs-CZ').getCalendars(), new X.Locale('cs-CZ').getNumberingSystems()].join('|'); }],
  ['locale in canonical', function (X) { return X.getCanonicalLocales(['EN-us', 'cs-cz']).join(); }],
  ['region en', function (X) { var d = new X.DisplayNames(['en'], { type: 'region' }); return ['CA', 'CZ', 'US', 'GB', 'KR', 'CI', 'HK', 'TR', 'BA', 'MM', '419'].map(function (c) { return d.of(c); }).join('|'); }],
  ['region cs', function (X) { var d = new X.DisplayNames(['cs'], { type: 'region' }); return ['CZ', 'SK', 'DE', 'AT', 'PL', 'US', 'GB', 'FR', 'UA', 'CH'].map(function (c) { return d.of(c); }).join('|'); }],
  ['script en', function (X) { var d = new X.DisplayNames(['en'], { type: 'script' }); return ['Arab', 'Latn', 'Cyrl', 'Hans', 'Hant', 'Jpan'].map(function (c) { return d.of(c); }).join('|'); }],
  ['everyday cs/en', function (X) {
    return [new X.NumberFormat('cs-CZ', { style: 'currency', currency: 'CZK' }).format(29.9), new X.NumberFormat('cs-CZ', { style: 'currency', currency: 'CZK' }).format(1234.5),
            new X.NumberFormat('cs-CZ', { style: 'currency', currency: 'CZK', maximumFractionDigits: 0 }).format(1990), new X.NumberFormat('cs-CZ', { style: 'currency', currency: 'EUR' }).format(12.5),
            new X.NumberFormat('cs-CZ').format(1234567.891), new X.NumberFormat('cs-CZ', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(1234.5), new X.NumberFormat('cs', { style: 'percent' }).format(0.25),
            new X.NumberFormat('cs-CZ', { style: 'unit', unit: 'kilogram' }).format(1.5), new X.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(1234.5), new X.NumberFormat('en-US').format(1234567.891),
            new X.NumberFormat('en', { notation: 'compact' }).format(12345), new X.NumberFormat('pl').format(1234), new X.NumberFormat('pl').format(12345), new X.NumberFormat('de').format(-1234.5),
            new X.NumberFormat('en', { minimumIntegerDigits: 3 }).format(7), new X.NumberFormat('en', { useGrouping: false }).format(1234567)].join(' | ').replace(/ /g, '_');
  }],
  // (rounded as the engines: the shortest decimal of the number, half away from zero)
  ['round 1.005', function (X) { return new X.NumberFormat('en', { maximumFractionDigits: 2 }).format(1.005); }],
  ['round 1.45', function (X) { return new X.NumberFormat('en', { maximumFractionDigits: 1 }).format(1.45); }],

  ['round 1.2345', function (X) { return new X.NumberFormat('en').format(1.2345); }],

  ['round big', function (X) { return new X.NumberFormat('en').format(1e21) + ' ' + new X.NumberFormat('en').format(123456789012.345); }],
  ['round tiny', function (X) { return new X.NumberFormat('en').format(1e-7) + ' ' + new X.NumberFormat('en', { maximumSignificantDigits: 2 }).format(1.25e-7); }],
  ['compact 999999', function (X) { return new X.NumberFormat('en', { notation: 'compact' }).format(999999); }],
  ['compact 999.96', function (X) { return new X.NumberFormat('en', { notation: 'compact' }).format(999.96); }],

  ['compact cs', function (X) { var f = new X.NumberFormat('cs', { notation: 'compact' }); return [1234, 1234567, 2.5e9].map(function (n) { return f.format(n); }).join().replace(/ /g, '_'); }],
  ['percent', function (X) { return [new X.NumberFormat('en', { style: 'percent' }).format(0.07), new X.NumberFormat('en', { style: 'percent', maximumFractionDigits: 1 }).format(0.075)].join(); }],
  ['sign displays', function (X) { return [new X.NumberFormat('en', { signDisplay: 'exceptZero' }).format(0.0001), new X.NumberFormat('en', { signDisplay: 'negative' }).format(-1), new X.NumberFormat('en', { signDisplay: 'always' }).format(0), new X.NumberFormat('en', { signDisplay: 'exceptZero' }).format(5), new X.NumberFormat('en', { signDisplay: 'never' }).format(-5)].join(); }],

  ['language standard', function (X) { var d = new X.DisplayNames(['en'], { type: 'language', languageDisplay: 'standard' }); return ['en-US', 'zh-Hans', 'cs-CZ'].map(function (c) { return d.of(c); }).join('|'); }],
